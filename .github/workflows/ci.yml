name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test workspace (Rust 1.93.1)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # action SHA
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        # Existing warnings are informational while the baseline is established;
        # compilation failures still fail this job.
        run: cargo clippy --workspace --all-targets --locked

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Build CLI and server
        run: cargo build --release -p php-cli --locked

      - name: Run PHP examples
        run: ./scripts/test-examples.sh target/release/php-rust
